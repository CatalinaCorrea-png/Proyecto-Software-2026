name: Tests & Coverage

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"

jobs:

  # ─── Backend: pytest + comentario de cobertura en el PR ──────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # necesario para comentar en el PR

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: backend
        run: python -m pytest tests/

      # Publica el reporte de cobertura como comentario en el PR
      # Solo usa el GITHUB_TOKEN incorporado — sin secrets externos
      - name: Post coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: backend/coverage.xml
          title: "Backend Coverage"
          badge-title: "Backend"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ─── Frontend: vitest + comentario de cobertura en el PR ─────────────────
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: frontend
        run: pnpm test:coverage

      # Publica el reporte de cobertura como comentario en el PR
      # Lee el lcov.info generado por @vitest/coverage-v8
      - name: Post coverage comment
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          json-summary-path: frontend/coverage/coverage-summary.json
          json-summary-compare-branch: main
          name: "Frontend Coverage"
          vite-config-path: frontend/vite.config.ts
